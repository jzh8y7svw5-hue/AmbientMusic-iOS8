name: Build AmbientMusic

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl git perl make python3 xz-utils libtinfo5

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install Linux iOS toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/ios-toolchain" "$HOME/theos/toolchain/linux/iphone"
          curl -fL --retry 3 \
            https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma \
            -o "$RUNNER_TEMP/ios-toolchain.tar.lzma"
          tar -xvf "$RUNNER_TEMP/ios-toolchain.tar.lzma" -C "$RUNNER_TEMP/ios-toolchain"
          cp -a "$RUNNER_TEMP/ios-toolchain/ios-arm64e-clang-toolchain/." "$HOME/theos/toolchain/linux/iphone/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version

      - name: Install iOS SDK
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          test -d "$RUNNER_TEMP/theos-sdks/iPhoneOS9.3.sdk"
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS9.3.sdk" "$HOME/theos/sdks/"

      - name: Build package
        run: |
          set -euxo pipefail
          make package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusic-deb
          path: packages/*.deb
          if-no-files-found: error
