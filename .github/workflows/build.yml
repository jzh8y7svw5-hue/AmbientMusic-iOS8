name: Build AmbientMusic

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bash curl git perl make python3 xz-utils lzma bzip2 libtinfo5

      - name: Install Theos
        run: |
          set -euxo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install Linux iOS toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/ios-toolchain" "$HOME/theos/toolchain/linux/iphone"
          curl -fL --retry 3 \
            https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma \
            -o "$RUNNER_TEMP/ios-toolchain.tar.lzma"
          tar --lzma -xf "$RUNNER_TEMP/ios-toolchain.tar.lzma" -C "$RUNNER_TEMP/ios-toolchain"
          TOOLCHAIN_DIR="$RUNNER_TEMP/ios-toolchain/ios-arm64e-clang-toolchain"
          test -d "$TOOLCHAIN_DIR"
          cp -a "$TOOLCHAIN_DIR/." "$HOME/theos/toolchain/linux/iphone/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version

      - name: Install iOS device SDK
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/theos/sdks"
          # Sparse checkout downloads only the iOS 9.3 device SDK, not every SDK in the repository.
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$RUNNER_TEMP/iOS-SDKs"
          git -C "$RUNNER_TEMP/iOS-SDKs" sparse-checkout set iPhoneOS9.3.sdk
          test -d "$RUNNER_TEMP/iOS-SDKs/iPhoneOS9.3.sdk"
          cp -a "$RUNNER_TEMP/iOS-SDKs/iPhoneOS9.3.sdk" "$HOME/theos/sdks/iPhoneOS9.3.sdk"
          test -d "$HOME/theos/sdks/iPhoneOS9.3.sdk/System/Library/Frameworks/UIKit.framework/Headers"
          echo "Installed SDK: $HOME/theos/sdks/iPhoneOS9.3.sdk"
          # Fail early if the SDK still contains simulator-only stubs for key frameworks.
          grep -R -n -m 1 'ios-simulator' \
            "$HOME/theos/sdks/iPhoneOS9.3.sdk/usr/lib/libSystem.tbd" \
            "$HOME/theos/sdks/iPhoneOS9.3.sdk/System/Library/Frameworks/UIKit.framework/UIKit.tbd" || true

      - name: Build package
        run: |
          set -euxo pipefail
          make package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusic-deb
          path: packages/*.deb
          if-no-files-found: error
