name: Build AmbientMusic

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bash curl git perl make python3 xz-utils lzma bzip2 libtinfo5

      - name: Install Theos
        run: |
          set -euxo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install Linux iOS toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/ios-toolchain" "$HOME/theos/toolchain/linux/iphone"
          curl -fL --retry 3 \
            https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma \
            -o "$RUNNER_TEMP/ios-toolchain.tar.lzma"
          tar --lzma -xf "$RUNNER_TEMP/ios-toolchain.tar.lzma" -C "$RUNNER_TEMP/ios-toolchain"
          TOOLCHAIN_DIR="$RUNNER_TEMP/ios-toolchain/ios-arm64e-clang-toolchain"
          test -d "$TOOLCHAIN_DIR"
          cp -a "$TOOLCHAIN_DIR/." "$HOME/theos/toolchain/linux/iphone/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version

      - name: Install iOS 9.2 device SDK
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/theos/sdks" "$RUNNER_TEMP/sdk"
          # Theos recommends iOS 9.2 for Linux; the 9.3 SDK produced simulator-only stubs.
          curl -fL --retry 3 https://sdks.website/dl/iPhoneOS9.2.sdk.tbz2 \
            -o "$RUNNER_TEMP/iPhoneOS9.2.sdk.tbz2"
          tar -xjf "$RUNNER_TEMP/iPhoneOS9.2.sdk.tbz2" -C "$RUNNER_TEMP/sdk"
          SDK_DIR="$(find "$RUNNER_TEMP/sdk" -type d -name 'iPhoneOS9.2.sdk' -print -quit)"
          test -n "$SDK_DIR"
          cp -a "$SDK_DIR" "$HOME/theos/sdks/iPhoneOS9.2.sdk"
          test -d "$HOME/theos/sdks/iPhoneOS9.2.sdk/System/Library/Frameworks/UIKit.framework/Headers"
          test -f "$HOME/theos/sdks/iPhoneOS9.2.sdk/usr/lib/system/liblaunch.tbd" -o -f "$HOME/theos/sdks/iPhoneOS9.2.sdk/usr/lib/system/liblaunch.dylib"
          if grep -R -n -m 1 'platform: ios-simulator' \
            "$HOME/theos/sdks/iPhoneOS9.2.sdk/usr/lib/libSystem.tbd" \
            "$HOME/theos/sdks/iPhoneOS9.2.sdk/System/Library/Frameworks/UIKit.framework/UIKit.tbd"; then
            echo 'ERROR: SDK contains simulator platform stubs, not a device SDK.'
            exit 1
          fi
          echo "Installed SDK: $HOME/theos/sdks/iPhoneOS9.2.sdk"

      - name: Build package
        run: |
          set -euxo pipefail
          # Point Theos at the installed 9.2 SDK instead of the old 9.3 SDK.
          sed -i 's/TARGET = iphone:clang:9\.3:8\.0/TARGET = iphone:clang:9.2:8.0/' Makefile
          grep '^TARGET' Makefile
          make package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusic-deb
          path: packages/*.deb
          if-no-files-found: error
